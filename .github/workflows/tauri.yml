# Builds unsigned installers. To sign later, add repo secrets and pass them
# into the tauri-action env (do not commit certificate files):
#
# macOS (Developer ID + notarization):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
#   or App Store Connect API: APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_PATH
#
# Windows Authenticode:
#   configure bundle.windows.certificateThumbprint / timestampUrl in tauri.conf.json
#   and provide the cert in CI (e.g. WINDOWS_CERTIFICATE + WINDOWS_CERTIFICATE_PASSWORD)
#
# Tauri updater signatures (optional, separate from OS code signing):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD

name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target: aarch64-apple-darwin
            name: macos-aarch64
          - platform: windows-latest
            # Always x86_64 (HostX64/x64). Do not add ARM64 ort binaries or extra --target.
            # Artifact is NSIS only (no MSI). WiX 3 light.exe often cannot run on
            # windows-2025 (missing .NET 3.5 / light.exe 0xc000007b).
            # GH Actions CAN: cargo test, tauri build, launch celld.exe (0xc000007b fails
            # at process create, before UI), dump PE IAT. CANNOT: GUI clicking / visual QA.
            target: x86_64-pc-windows-msvc
            name: windows-x64
          # ubuntu-24.04: pykeio ort's prebuilt ONNX Runtime needs glibc 2.38+
          # (__isoc23_*) and GCC 13+ libstdc++ (_M_replace_cold). 22.04 cannot link.
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            xdg-utils

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          shared-key: ${{ matrix.target }}

      # Default features only (onnx is optional). cargo test here also compiles the
      # Windows MSVC binary without ort, so a link/CRT mismatch fails before packaging.
      - name: Run Rust unit tests
        if: runner.os == 'Windows'
        working-directory: src-tauri
        run: cargo test --locked --target ${{ matrix.target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm tauri
          # Windows: NSIS only (bundle.targets omits msi). WiX 3 light.exe often
          # cannot run on windows-2025 (missing .NET 3.5 / light.exe 0xc000007b).
          args: --target ${{ matrix.target }}
          # Do not publish from the matrix: a failed platform (or a draft release)
          # would hide installers from the tag page. The `release` job attaches
          # whatever platforms succeeded.
          includeRelease: false

      # Default tauri build does not pass --features onnx; fail if the IAT still
      # names DirectML / ONNX Runtime (the 0xc000007b class of missing-DLL load).
      - name: Check Windows PE imports
        id: win_exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = $null
          $releaseRoot = Join-Path $pwd "src-tauri/target/${{ matrix.target }}/release"
          foreach ($name in @('celld.exe', 'Celled.exe')) {
            $candidate = Join-Path $releaseRoot $name
            if (Test-Path -LiteralPath $candidate) {
              $exe = $candidate
              break
            }
          }
          if (-not $exe) {
            $exe = Get-ChildItem -LiteralPath $releaseRoot -Filter '*.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -match '^(celld|Celled)\.exe$' -and $_.FullName -notmatch '[\\/]bundle[\\/]' } |
              Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $exe) {
            throw "Could not find celld.exe / Celled.exe under $releaseRoot (excluding bundle/)"
          }
          Write-Host "App exe: $exe"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "path=$exe"

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) {
            throw "vswhere.exe not found; cannot locate dumpbin on this runner"
          }
          $dumpbin = & $vswhere -latest -products * -find '**\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) {
            throw 'dumpbin.exe not found (expected on windows-latest / windows-2025 with VS)'
          }
          Write-Host "dumpbin: $dumpbin"
          $dump = & $dumpbin /DEPENDENTS $exe 2>&1 | Out-String
          Write-Host $dump
          $imports = @([regex]::Matches($dump, '(?im)^\s+([A-Za-z0-9_\-\.]+\.dll)\s*$') |
            ForEach-Object { $_.Groups[1].Value })
          if ($imports.Count -eq 0) {
            throw "Could not list PE dependents of $exe"
          }
          $forbidden = @('directml.dll', 'onnxruntime.dll')
          $hits = @($imports | Where-Object { $forbidden -contains $_.ToLowerInvariant() })
          if ($hits.Count -gt 0) {
            throw "Default (no --features onnx) exe IAT-imports forbidden DLL(s): $($hits -join ', '). ort/DirectML must not be linked when onnx is off."
          }
          Write-Host 'PE import check passed (no directml.dll / onnxruntime.dll).'

      # 0xc000007b (STATUS_INVALID_IMAGE_FORMAT) fails at process create, before UI.
      # Missing WebView2 on the runner can kill the process after start — that is not 0xc000007b.
      - name: Smoke-launch Windows exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = '${{ steps.win_exe.outputs.path }}'
          if (-not $exe -or -not (Test-Path -LiteralPath $exe)) {
            throw "Missing exe path from previous step: '$exe'"
          }
          Write-Host "Launching $exe (15s). 0xc000007b / STATUS_INVALID_IMAGE_FORMAT fails the job."
          Write-Host 'WebView2 may be missing on the runner; a start-then-die for WebView2 is not 0xc000007b.'

          $STATUS_INVALID_IMAGE_FORMAT = [Convert]::ToUInt32('C000007B', 16)
          function Get-UnsignedExitCode([int]$code) {
            [BitConverter]::ToUInt32([BitConverter]::GetBytes([int32]$code), 0)
          }

          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $exe
          $psi.WorkingDirectory = [System.IO.Path]::GetDirectoryName($exe)
          $psi.UseShellExecute = $false
          $psi.CreateNoWindow = $true
          $proc = New-Object System.Diagnostics.Process
          $proc.StartInfo = $psi
          try {
            $null = $proc.Start()
          } catch [System.ComponentModel.Win32Exception] {
            $native = $_.Exception.NativeErrorCode
            $msg = $_.Exception.Message
            Write-Host "Start failed: $msg NativeErrorCode=$native"
            $unsignedNative = Get-UnsignedExitCode $native
            if ($unsignedNative -eq $STATUS_INVALID_IMAGE_FORMAT -or $native -eq 193 -or $msg -match '0xc000007b') {
              throw "STATUS_INVALID_IMAGE_FORMAT (0xc000007b) starting $exe"
            }
            throw
          }

          if (-not $proc.WaitForExit(15000)) {
            Write-Host 'Still running after 15s — loader accepted the image (not 0xc000007b).'
            try { $proc.Kill() } catch {}
            exit 0
          }

          $code = $proc.ExitCode
          $unsigned = Get-UnsignedExitCode $code
          Write-Host ("Exited with {0} (0x{1:X8})" -f $code, $unsigned)
          if ($unsigned -eq $STATUS_INVALID_IMAGE_FORMAT) {
            throw "STATUS_INVALID_IMAGE_FORMAT (0xc000007b) launching $exe"
          }
          Write-Host 'Non-0xc000007b exit (missing WebView2 on the runner is expected).'

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: celld-${{ matrix.name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error
          compression-level: 0

  # Matrix jobs upload Actions artifacts even when a sibling fails (fail-fast: false).
  # GitHub still marks the workflow red if Linux fails; this job still attaches the
  # successful installers to the tag so they show on the Releases page (not only Actions).
  release:
    name: Attach installers to GitHub Release
    needs: build
    if: ${{ always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - name: Download artifacts from successful platforms
        uses: actions/download-artifact@v7
        with:
          path: dist
          pattern: celld-*

      - name: Publish installers on the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.msi
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.rpm
            dist/**/*.app.tar.gz
            dist/**/*.tar.gz
          )
          # Deduplicate if both *.tar.gz and *.app.tar.gz match the same file.
          declare -A seen=()
          unique=()
          for f in "${files[@]}"; do
            if [[ -f "$f" && -z "${seen[$f]:-}" ]]; then
              seen[$f]=1
              unique+=("$f")
            fi
          done
          if [ ${#unique[@]} -eq 0 ]; then
            echo "No installer artifacts were produced by any platform."
            find dist -type f | sort || true
            exit 1
          fi
          echo "Uploading to ${{ github.ref_name }}:"
          printf '  %s\n' "${unique[@]}"

          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release edit "${{ github.ref_name }}" --draft=false
          else
            gh release create "${{ github.ref_name }}" \
              --title "celld ${{ github.ref_name }}" \
              --notes "See the assets to download this version and install."
          fi
          gh release upload "${{ github.ref_name }}" "${unique[@]}" --clobber
